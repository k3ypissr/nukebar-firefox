<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>K3ypissr NukeBar - response viewer</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    #meta { font-size: 12px; color: var(--dim); margin-bottom: 10px; word-break: break-all; }
    .tabs { margin-top: 8px; }
    #preview { width: 100%; height: 62vh; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    #headers { max-height: 34vh; overflow: auto; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="logo">
    <img src="../icons/icon.png" alt="">
    <div>
      <h1>Response viewer</h1>
      <div class="sub" id="meta">Loading...</div>
    </div>
  </div>

  <div class="row">
    <button id="reload">Reload request</button>
    <button id="copy">Copy body</button>
    <button id="open">Open URL in tab</button>
    <span class="badge" id="mode">raw</span>
  </div>

  <div class="tabs">
    <button class="active" data-tab="body">Body</button>
    <button data-tab="preview">Preview (scripts disabled)</button>
    <button data-tab="headers">Headers</button>
  </div>

  <div id="pane-body">
    <pre id="body">Loading...</pre>
  </div>
  <div id="pane-preview" class="hidden">
    <iframe id="preview" sandbox="" referrerpolicy="no-referrer"></iframe>
    <p class="note">Preview renders with a sandboxed iframe (no scripts, no same-origin access). External resources may still load.</p>
  </div>
  <div id="pane-headers" class="hidden">
    <table id="headers"><thead><tr><th>Header</th><th>Value</th></tr></thead><tbody></tbody></table>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
